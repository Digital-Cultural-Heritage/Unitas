<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FDFBF7">
  <meta name="description" content="Unitas — Jejaring Alumni Digital Universitas Udayana">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Unitas">
  <meta name="google-signin-client_id" content="900620974472-q2n23p2jtahugolc13a51ma0plo2pi1n.apps.googleusercontent.com">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Unitas — Jejaring Alumni Unud</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background-color: #FDFBF7;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #splash-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FDFBF7;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }
    .splash-logo {
      width: 68px;
      height: 68px;
      object-fit: contain;
    }
    .splash-title {
      margin-top: 14px;
      color: #1E3A5F;
      font-size: 22px;
      font-weight: 700;
    }
    .splash-sub {
      margin-top: 4px;
      color: rgba(30, 58, 95, 0.6);
      font-size: 13px;
    }
    .splash-bar {
      margin-top: 20px;
      width: 140px;
      height: 3px;
      border-radius: 99px;
      background-color: rgba(30, 58, 95, 0.12);
      overflow: hidden;
      position: relative;
    }
    .splash-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 45%;
      background-color: #1E3A5F;
      border-radius: 99px;
      animation: splashSlide 1.1s ease-in-out infinite;
    }
    @keyframes splashSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }
  </style>
</head>
<body>
  <div id="splash-loader">
    <img class="splash-logo" src="icons/logo-splash.png" alt="Unitas" />
    <div class="splash-title">Unitas</div>
    <div class="splash-sub">Memuat aplikasi…</div>
    <div class="splash-bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('splash-loader');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 250);
      }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
