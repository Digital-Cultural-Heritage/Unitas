<!DOCTYPE html>
<html>
<head>

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FDFBF7">
  <meta name="description" content="Unitas - Jejaring Alumni Digital Universitas Udayana">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Unitas">
  <meta name="google-signin-client_id" content="900620974472-q2n23p2jtahugolc13a51ma0plo2pi1n.apps.googleusercontent.com">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Unitas | Jejaring Alumni Unud</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background-color: #FDFBF7;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: pan-x pan-y;
      -webkit-text-size-adjust: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    input,
    textarea,
    select,
    [contenteditable="true"],
    .flt-text-editing,
    flt-text-editing-host input,
    flt-text-editing-host textarea,
    flt-semantics input,
    flt-semantics textarea {
      font-size: 16px !important;
    }
    #splash-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FDFBF7;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }
    .splash-logo {
      width: 68px;
      height: 68px;
      object-fit: contain;
    }
    .splash-title {
      margin-top: 14px;
      color: #1E3A5F;
      font-size: 22px;
      font-weight: 700;
    }
    .splash-sub {
      margin-top: 4px;
      color: rgba(30, 58, 95, 0.6);
      font-size: 13px;
    }
    .splash-bar {
      margin-top: 20px;
      width: 140px;
      height: 3px;
      border-radius: 99px;
      background-color: rgba(30, 58, 95, 0.12);
      overflow: hidden;
      position: relative;
    }
    .splash-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 45%;
      background-color: #1E3A5F;
      border-radius: 99px;
      animation: splashSlide 1.1s ease-in-out infinite;
    }
    @keyframes splashSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }
  </style>
</head>
<body>
  <div id="splash-loader">
    <img class="splash-logo" src="icons/logo-splash.png" alt="Unitas" />
    <div class="splash-title">Unitas</div>
    <div class="splash-sub">Memuat aplikasi…</div>
    <div class="splash-bar"></div>
  </div>
  <script>
    (function () {
      var NO_ZOOM_CSS =
        'input, textarea, select, [contenteditable="true"], .flt-text-editing, ' +
        'flt-text-editing-host input, flt-text-editing-host textarea, ' +
        'flt-semantics input, flt-semantics textarea { font-size: 16px !important; }';

      function injectNoZoomIntoShadow(el) {
        if (!el || !el.shadowRoot) return;
        if (el.shadowRoot.getElementById('unitas-ios-no-zoom')) return;
        var style = document.createElement('style');
        style.id = 'unitas-ios-no-zoom';
        style.textContent = NO_ZOOM_CSS;
        el.shadowRoot.appendChild(style);
      }

      function scanFlutterHosts() {
        var hosts = document.querySelectorAll('flt-glass-pane, flutter-view');
        for (var i = 0; i < hosts.length; i++) {
          injectNoZoomIntoShadow(hosts[i]);
        }
      }

      window.addEventListener('flutter-first-frame', function () {
        var el = document.getElementById('splash-loader');
        if (el) {
          el.style.opacity = '0';
          setTimeout(function () { el.remove(); }, 250);
        }
        scanFlutterHosts();
      });

      if (document.body && typeof MutationObserver !== 'undefined') {
        var observer = new MutationObserver(function () {
          scanFlutterHosts();
        });
        observer.observe(document.body, { childList: true });
      }
      scanFlutterHosts();

      function blockGesture(e) {
        e.preventDefault();
      }
      document.addEventListener('gesturestart', blockGesture, { passive: false });
      document.addEventListener('gesturechange', blockGesture, { passive: false });
      document.addEventListener('gestureend', blockGesture, { passive: false });

      function isEditableTag(el) {
        if (!el) return false;
        var tag = el.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || !!el.isContentEditable;
      }

      function isEditableFocused() {
        if (isEditableTag(document.activeElement)) return true;
        var hosts = document.querySelectorAll('flt-glass-pane, flutter-view');
        for (var i = 0; i < hosts.length; i++) {
          var sr = hosts[i].shadowRoot;
          if (sr && isEditableTag(sr.activeElement)) return true;
        }
        return false;
      }

      var lastResetAt = 0;
      var resetTimer = null;

      function resetViewportIfNeeded() {
        if (isEditableFocused()) return;
        var now = Date.now();
        if (now - lastResetAt < 400) return;

        var scrolled = window.scrollX !== 0 || window.scrollY !== 0;
        var vv = window.visualViewport;
        var zoomed = !!(vv && vv.scale > 1.01);
        if (!scrolled && !zoomed) return;

        lastResetAt = now;
        if (zoomed) {
          var meta = document.querySelector('meta[name="viewport"]');
          if (meta) {
            var baseContent =
              'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover';
            meta.setAttribute(
              'content',
              'width=device-width, initial-scale=1.0, maximum-scale=1.0001, minimum-scale=1.0, user-scalable=no, viewport-fit=cover'
            );
            requestAnimationFrame(function () {
              meta.setAttribute('content', baseContent);
              window.scrollTo(0, 0);
            });
            return;
          }
        }
        window.scrollTo(0, 0);
      }

      function scheduleViewportReset() {
        if (resetTimer) clearTimeout(resetTimer);
        resetTimer = setTimeout(resetViewportIfNeeded, 150);
      }

      window.addEventListener('focusout', scheduleViewportReset, true);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', scheduleViewportReset);
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          scheduleViewportReset();
        }
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
